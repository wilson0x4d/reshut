[project]
name = "reshut"
version = "0.0.0"
description = "..an authorization library for Falcon."
keywords = ["falcon","auth","bearer","apikey","hmac","rsa","ed25519", "ed448"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
    "cryptography (>=48)",
    "falcon (>=4.2)",
    "pyjwt[crypto] (>=2.12.1)"
]

[dependency-groups]
dev = [
    "build",
    "coverage",
    "mypy",
    "punit (>=1.13.3)",
    "py-conventional-semver (>=1.3.4)",
    "twine"
]

[project.scripts]
reshut-keygen = "reshut.__main__:reshut_keygen_cli"
reshut-tokenize = "reshut.__main__:reshut_tokenize_cli"
reshut-validate = "reshut.__main__:reshut_validate_cli"

[tool.setuptools.package-data]
"reshut" = ["py.typed"]
