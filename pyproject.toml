[project]
name = "reshut"
version = "0.0.0"
description = "..an authorization library for Falcon."
keywords = ["falcon","auth","bearer","apikey","hmac","rsa","ed25519", "ed448"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
    "cryptography (>=48)",
    "falcon (>=4.2,<5)",
    "pyjwt (>=2.12.1,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "coverage",
    "lxml-stubs==0.5.1",
    "mypy",
    "punit (>=1.3.7,<2.0.0)",
    "twine"
]
