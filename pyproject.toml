[project]
name = "reshut"
version = "0.0.0"
description = "..an authorization library for Falcon."
keywords = ["falcon","auth","bearer","apikey","hmac","rsa","ed25519", "ed448","mateh"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
    "cryptography (>=48)",
    "falcon (>=4.2)",
    "pyjwt[crypto] (>=2.12.1)"
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "mypy",
    "punit (>=1.12.5)",
    "twine"
]

[tool.setuptools.data-files]
bin = [
    ".scripts/reshut-keygen",
    ".scripts/reshut-tokenize",
    ".scripts/reshut-validate"
]

[tool.setuptools.package-data]
"reshut" = ["py.typed"]
